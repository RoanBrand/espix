dependencies:
  # 6.1, not "5.0 or newer". espix's SSH and password hashing are written
  # against PSA Crypto, which arrives with Mbed TLS 4.x / TF-PSA-Crypto in IDF
  # 6.1; espix_kernel names CHIP_ESP32S31, added in the same release. Declaring
  # this here means the component manager refuses with one clear line instead of
  # letting an older IDF fail deep in a compile.
  idf:
    version: ">=6.1"

  # Root filesystem. VFS-backed, so apps get plain fopen()/opendir().
  joltwallet/littlefs: "==1.22.3"

  # Line editing, one instance per session. IDF's own linenoise keeps its
  # history and callbacks in file-scope statics and reads raw descriptors, so it
  # can serve exactly one fd-backed console; this one is handle-based and takes
  # read/write callbacks, which is what lets an SSH session — whose bytes arrive
  # inside encrypted packets — use the same editor as the serial console.
  espressif/esp_linenoise: "^1.0.4"

  # Runtime ELF loader: relocates and runs natively-compiled apps read off the
  # filesystem, plus dlopen()/dlsym() for shared objects.
  # Supports esp32s3 / esp32p4 / esp32s31, which are espix's three targets.
  espressif/elf_loader: "~1.3.3"

  # USB-NCM: Ethernet over the USB-OTG port, so the board is reachable over a
  # cable with no network at all. Espressif's own additions to TinyUSB rather
  # than raw tud_network_* callbacks, for one reason that matters:
  # tinyusb_net_send_async() marshals the transmit onto TinyUSB's task via
  # usbd_defer_func(), and tud_network_xmit() must run on that task rather than
  # on whatever task esp_netif's output path happens to be.
  #
  # Targets esp32s3 / esp32p4 / esp32s31, which are espix's three.
  #
  # Fetched unconditionally, and note what CONFIG_ESPIX_USB_NCM_ENABLED does and
  # does not do: the component manager resolves manifests before Kconfig exists,
  # so it cannot key off a project option. Turning the option off drops espix's
  # own driver and the TinyUSB stack from the *link*, which is where the flash
  # and RAM go; the sources are still downloaded.
  espressif/esp_tinyusb: "^2.2.1"
