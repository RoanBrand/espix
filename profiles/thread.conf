# Thread border router build -- the S31 only; the S3 has no 802.15.4 radio.
#
#     make TARGET=esp32s31 PROFILE=thread build
#     make TARGET=esp32s31 PROFILE=thread flash-ota
#
# Its own sdkconfig.<target>-thread and build-<target>-thread, as with sysview.
# Thread itself is a runtime choice once built in (/etc/thread.conf); this is
# the build that has it. See docs/THREAD.md.

CONFIG_ESPIX_THREAD=y
CONFIG_ESPIX_THREAD_BORDER_ROUTER=y
