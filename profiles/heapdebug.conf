# Heap corruption hunting -- development only, never released.
#
#     make PROFILE=heapdebug build
#     make PROFILE=heapdebug flash-ota
#
# Its own sdkconfig.<target>-heapdebug and build-<target>-heapdebug, as with
# sysview. Every block gets head and tail canaries and freed memory is filled,
# so an overrun or a use-after-free is caught at the next free or allocation
# rather than wherever it happens to crash; and a kernel thread checks the whole
# heap every 100 ms, so the damage is dated to a window the serial log can be
# lined up against. Slow: every malloc and free fills and checks.

CONFIG_HEAP_POISONING_COMPREHENSIVE=y
CONFIG_HEAP_TASK_TRACKING=y
CONFIG_ESPIX_HEAP_CHECK_MS=100

