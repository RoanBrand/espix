# SystemView profiling build -- development only, never released.
#
# Enable with the PROFILE dimension, alongside TARGET:
#
#     make PROFILE=sysview build
#     make PROFILE=sysview flash-ota
#
# which configures sdkconfig.<target>-sysview into build-<target>-sysview, so it
# shares nothing with the normal build and switching between them is not a
# rebuild. See docs/PROFILING.md, "SystemView".
#
# Why this is a separate build rather than a menu toggle on the normal one: with
# CONFIG_ESP_TRACE_ENABLE=y the encoder hooks run on every task switch and ISR
# even when no host is attached, so a build that records every switch cannot
# also be the build whose performance is under test. The normal and release
# builds leave tracing off and pay nothing for it, because nothing references
# the encoder and the linker drops it.

# The encoder is espressif/esp_sysview (main/idf_component.yml). It registers
# itself as "sysview" while Kconfig's external-library default is the generic
# "ext"; that mismatch is resolved in main/espix_main.c, because
# CONFIG_ESP_TRACE_LIB_NAME has no prompt and so cannot be set from here.
CONFIG_ESP_TRACE_ENABLE=y
CONFIG_ESP_TRACE_LIB_EXTERNAL=y

# Transport: USB-Serial/JTAG. It streams SystemView packets over the same USB-C
# debug port's serial interface, so it needs no host adapter at all -- SEGGER
# SystemView reads it as a live serial source.
#
# The IDF docs' headline path is apptrace over JTAG, which OpenOCD collects with
# `esp sysview start`. That does not work on the S31 yet: OpenOCD
# v0.12.0-esp32-20260703 finds the target but fails to read its trace block
# ("Failed to get max trace block size!" / "Failed to init cmd ctx (-4)!"), with
# either transport built. See docs/PROFILING.md.
CONFIG_ESP_TRACE_TRANSPORT_USB_SERIAL_JTAG=y

# Which CPU the single USB-Serial/JTAG stream carries -- one at a time. espix
# pins espix:vnc to CPU1, so the desktop/display path is CPU1; set 0 to watch
# the network/ssh side instead.
CONFIG_ESPIX_TRACE_CORE=1

# The transport's TX ring. The 2 KB default overflows on the first busy second
# of a display workload -- SystemView then reports "overflow events recorded"
# and the trace has holes. 32 KB is the maximum the driver allows; it is
# internal RAM and the profile build has the headroom (the normal build keeps
# the 2 KB default and pays nothing).
CONFIG_ESP_TRACE_USJ_TX_BUFFER_SIZE=32768

# esp_timer is already running at 1 us resolution and is the least intrusive of
# the three; the cycle counter would perturb less but is per-core.
CONFIG_ESP_TRACE_TS_SOURCE_ESP_TIMER=y

# The component's default is 16 and espix runs about 20 tasks; SystemView drops
# what it cannot name, so a trace at the default would silently lose tasks.
CONFIG_SEGGER_SYSVIEW_MAX_TASKS=32

# What the timeline is made of. The IDF example enables the same set, and there
# is no cost worth saving in a build that exists to be measured.
CONFIG_SEGGER_SYSVIEW_EVT_OVERFLOW_ENABLE=y
CONFIG_SEGGER_SYSVIEW_EVT_ISR_ENTER_ENABLE=y
CONFIG_SEGGER_SYSVIEW_EVT_ISR_EXIT_ENABLE=y
CONFIG_SEGGER_SYSVIEW_EVT_ISR_TO_SCHED_ENABLE=y
CONFIG_SEGGER_SYSVIEW_EVT_TASK_START_EXEC_ENABLE=y
CONFIG_SEGGER_SYSVIEW_EVT_TASK_STOP_EXEC_ENABLE=y
CONFIG_SEGGER_SYSVIEW_EVT_TASK_START_READY_ENABLE=y
CONFIG_SEGGER_SYSVIEW_EVT_TASK_STOP_READY_ENABLE=y
CONFIG_SEGGER_SYSVIEW_EVT_TASK_CREATE_ENABLE=y
CONFIG_SEGGER_SYSVIEW_EVT_TASK_TERMINATE_ENABLE=y
CONFIG_SEGGER_SYSVIEW_EVT_IDLE_ENABLE=y
CONFIG_SEGGER_SYSVIEW_EVT_TIMER_ENTER_ENABLE=y
CONFIG_SEGGER_SYSVIEW_EVT_TIMER_EXIT_ENABLE=y
