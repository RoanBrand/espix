# ESP32-S3-WROOM-1-N8R2 — 8MB flash, 2MB quad PSRAM.
# Also the older ESP32-S3-DevKitC-1 and most cheap clones.
#
#   SDKCONFIG_DEFAULTS="sdkconfig.defaults;boards/esp32s3-n8r2.conf" \
#       idf.py set-target esp32s3
#   idf.py build
#
# Only the differences from sdkconfig.defaults.esp32s3 (which targets N16R8)
# belong here: the build system applies that file first, so selecting another
# member of a Kconfig choice deselects the default. PSRAM *size* is detected at
# runtime (SPIRAM_TYPE_AUTO), so quad-vs-octal is the only memory setting that
# has to be stated.
#
# Build-verified only; espix has been run on hardware on N16R8 alone.

CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y
CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions/esp32s3-8mb.csv"

CONFIG_SPIRAM_MODE_QUAD=y
