# ESP32-S3-WROOM-1-N8 — 8MB flash, NO PSRAM.
#
#   SDKCONFIG_DEFAULTS="sdkconfig.defaults;boards/esp32s3-n8.conf" \
#       idf.py set-target esp32s3
#   idf.py build
#
# UNTESTED, and the one variant with a real reason to doubt it.
#
# espix loads app images into PSRAM by default. Without it both fallbacks do
# the right thing on their own — ELF_LOADER_LOAD_PSRAM depends on SPIRAM so it
# switches off, and image_alloc() in espix_proc/exec.c already falls back to
# malloc() — but everything then competes for the ~343K of internal heap that
# WiFi, lwIP and an SSH session already draw on. Expect small apps to work and
# larger ones to fail on allocation. If you have such a board, reports welcome.
#
# For an N4 or N16 module, change the flash size and partition filename below;
# nothing else differs.

CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y
CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions/esp32s3-8mb.csv"

CONFIG_SPIRAM=n

# Without PSRAM this would attempt an allocation that can only fail before
# falling back, on every exec.
CONFIG_ESPIX_PROC_IMAGE_IN_PSRAM=n
