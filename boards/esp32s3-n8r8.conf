# ESP32-S3-WROOM-1-N8R8 — 8MB flash, 8MB octal PSRAM.
#
#   SDKCONFIG_DEFAULTS="sdkconfig.defaults;boards/esp32s3-n8r8.conf" \
#       idf.py set-target esp32s3
#   idf.py build
#
# Same PSRAM as the N16R8 default, so this only resizes the flash and points at
# the matching partition table.
#
# Build-verified only; espix has been run on hardware on N16R8 alone.

CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y
CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions/esp32s3-8mb.csv"
