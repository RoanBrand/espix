# What Doom needs that espix does not ship.
#
# The engine is an app; the shareware WAD is data, and it is fetched once on the
# first launch -- from the desktop icon or from 'espix doom' -- by the launcher,
# before either spawns anything. Staged into /etc/apps/ by tools/build-apps.sh,
# which is what puts it in both the development rootfs and the clean one a
# release builds.
#
#     data  <url>  <path>  sha256:<hex>
#
# 4 MB into a filesystem that also holds the kernel, so this wants a board that
# has not been lived in: 'df' first, and 'ls /boot' for a kernel to remove if it
# is tight. A copy on a USB stick at /mnt/sda1/doom1.wad is still found by the
# program itself, and a failed download is reported without refusing to run.

data  https://raw.githubusercontent.com/alexkid77/ESP32P4DOOM/master/spiffs/doom1.wad  /var/lib/doom/doom1.wad  sha256:1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771
